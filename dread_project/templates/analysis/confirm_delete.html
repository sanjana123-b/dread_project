{% extends 'analysis/base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<div class="page-header"><h1>Delete {{ type|title }}</h1></div>
<div class="card">
  <p>Are you sure you want to delete "<strong>{{ object }}</strong>"? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="javascript:history.back()" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
