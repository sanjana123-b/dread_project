{% extends "analysis/base.html" %}

{% block title %}Page Not Found | ThreatScope{% endblock %}

{% block content %}
<div class="page-container" style="min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center;">
  <div class="font-mono" style="font-size: 96px; font-weight: 600; user-select: none; color: rgba(255,255,255,0.04); margin-bottom: -32px;" aria-hidden="true">
    404
  </div>
  
  <div>
    <h1 class="font-display" style="font-size: 28px; font-weight: 600; margin-bottom: 8px;">Page not found</h1>
    <p style="font-size: 14px; color: var(--text-muted); margin: 0;">
      That URL does not exist. Check the address or navigate back.
    </p>
  </div>
  
  <a href="{% url 'dashboard' %}" class="btn btn--primary btn--md" style="margin-top: 12px;">Back to dashboard</a>
</div>
{% endblock %}
