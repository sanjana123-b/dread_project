{% load static %}
<nav class="navbar" role="navigation" aria-label="Main" style="position: fixed; width: 100%; height: 76px; background: var(--nav-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-hairline); z-index: 40; padding: 0 32px; display: flex; align-items: center; top: 0; left: 0;">
  <a href="{% url 'dashboard' %}" style="display: flex; align-items: center; gap: 12px; margin-right: 40px; text-decoration: none;" class="focus-ring">
    <img src="{% static 'analysis/img/dread_project_logo.png' %}" alt="ThreatScope Logo" style="height: 64px; width: auto; object-fit: contain;">
  </a>

  <div style="display: flex; gap: 8px;">
    <a href="{% url 'dashboard' %}" class="focus-ring" style="padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; text-decoration: none; {% if request.resolver_match.url_name == 'dashboard' %}background: rgba(59,130,246,0.12); color: var(--accent-hover);{% else %}color: var(--text-secondary);{% endif %}">Dashboard</a>
    <a href="{% url 'project_list' %}" class="focus-ring" style="padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; text-decoration: none; {% if 'project' in request.resolver_match.url_name or 'threat' in request.resolver_match.url_name %}background: rgba(59,130,246,0.12); color: var(--accent-hover);{% else %}color: var(--text-secondary);{% endif %}">Projects</a>
  </div>

  <div style="margin-left: auto; display: flex; align-items: center; gap: 16px;">
    
    <button id="theme-toggle" class="focus-ring" aria-label="Toggle theme" style="background: transparent; border: none; padding: 6px; border-radius: 6px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="toggleTheme()">
      <svg id="theme-icon-moon" style="display: none; width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg id="theme-icon-sun" style="display: none; width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <div style="position: relative;" id="avatar-menu">
      <button aria-expanded="false" aria-haspopup="menu" class="focus-ring" style="background: rgba(255,255,255,0.06); border: 1px solid var(--border-hairline); border-radius: 8px; padding: 5px 10px 5px 6px; display: flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer;" onclick="document.getElementById('avatar-dropdown').classList.toggle('is-open'); this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');">
        {% if user.profile.profile_picture %}
          <img src="{{ user.profile.profile_picture.url }}" alt="{{ user.username }}" style="width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-hairline);">
        {% else %}
          <div style="width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: white;">
            {{ user.username|make_list|first|upper }}
          </div>
        {% endif %}
        {{ user.username }}
        <span style="opacity: 0.5; font-size: 12px;" aria-hidden="true">▼</span>
      </button>
      
      <div id="avatar-dropdown" role="menu" style="display: none; position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface-overlay); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-strong); border-radius: 10px; padding: 4px; min-width: 160px; box-shadow: var(--shadow-e2);">
        <a href="{% url 'profile' %}" role="menuitem" class="focus-ring" style="display: block; padding: 8px 12px; border-radius: 6px; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--text-secondary); text-decoration: none;">Edit Profile</a>
        <div style="height: 1px; background: var(--border-hairline); margin: 4px 0;"></div>
        <form method="post" action="{% url 'logout' %}" style="margin: 0;">
          {% csrf_token %}
          <button type="submit" role="menuitem" class="focus-ring" style="width: 100%; text-align: left; padding: 8px 12px; border-radius: 6px; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--risk-critical); background: transparent; border: none; cursor: pointer;">
            Log out
          </button>
        </form>
      </div>
    </div>
  </div>
</nav>
<style>
#avatar-dropdown.is-open { display: block !important; }
#avatar-dropdown a:hover, #avatar-dropdown button:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
</style>
<script>
document.addEventListener('click', function(e) {
  var menu = document.getElementById('avatar-menu');
  var dropdown = document.getElementById('avatar-dropdown');
  if (menu && !menu.contains(e.target) && dropdown.classList.contains('is-open')) {
    dropdown.classList.remove('is-open');
    menu.querySelector('button').setAttribute('aria-expanded', 'false');
  }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    var dropdown = document.getElementById('avatar-dropdown');
    var btn = document.querySelector('#avatar-menu button');
    if (dropdown && dropdown.classList.contains('is-open')) {
      dropdown.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
      btn.focus();
    }
  }
});
</script>
