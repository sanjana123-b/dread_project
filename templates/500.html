{% extends "analysis/base.html" %}

{% block title %}Server Error | ThreatScope{% endblock %}

{% block content %}
<div class="page-container" style="min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center;">
  <div class="font-mono" style="font-size: 96px; font-weight: 600; user-select: none; color: rgba(255,61,113,0.06); margin-bottom: -32px;" aria-hidden="true">
    500
  </div>
  
  <div>
    <h1 class="font-display" style="font-size: 28px; font-weight: 600; margin-bottom: 8px;">Internal Server Error</h1>
    <p style="font-size: 14px; color: var(--text-muted); margin: 0; max-width: 320px;">
      Something went wrong on our end. The team has been notified. Please try again later.
    </p>
  </div>
  
  <a href="{% url 'dashboard' %}" class="btn btn--primary btn--md" style="margin-top: 12px;">Back to dashboard</a>
</div>
{% endblock %}
